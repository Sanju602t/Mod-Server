name = "shadow-cms"
main = "src/index.js"
compatibility_date = "2024-12-18"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "shadow-cms-db"
database_id = "your-database-id"  # replace after creation

# Environment variables (username is public, password is secret)
[vars]
USERNAME = "Shadow"

# Secrets are set via `wrangler secret put PASSWORD`
